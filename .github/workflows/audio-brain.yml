name: audio-brain

on:
  push:
    paths:
      - 'audio-brain/**'
      - '.github/workflows/audio-brain.yml'
  pull_request:
    paths:
      - 'audio-brain/**'
      - '.github/workflows/audio-brain.yml'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: audio-brain/requirements.txt

      - name: Install dependencies
        working-directory: audio-brain
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: audio-brain
        run: pytest --tb=short -q
