name: game-service

on:
  push:
    paths:
      - 'game-service/**'
      - '.github/workflows/game-service.yml'
  pull_request:
    paths:
      - 'game-service/**'
      - '.github/workflows/game-service.yml'

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: game_db_test
          MYSQL_USER: game_user
          MYSQL_PASSWORD: game_pass
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, intl
          coverage: none

      - name: Install dependencies
        working-directory: game-service
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure test environment
        working-directory: game-service
        run: |
          cp .env.test .env.local.test
          # En CI el MySQL de test corre en 127.0.0.1:3308 (puerto mapeado por el service)
          echo 'DATABASE_URL="mysql://game_user:game_pass@127.0.0.1:3308/game_db_test?serverVersion=8.0&charset=utf8mb4"' >> .env.local.test
          echo 'AUDIO_BRAIN_URL=http://localhost:8002' >> .env.local.test

      - name: Run migrations
        working-directory: game-service
        env:
          APP_ENV: test
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Unit tests
        working-directory: game-service
        env:
          APP_ENV: test
        run: php bin/phpunit --testsuite Unit

      - name: Integration tests
        working-directory: game-service
        env:
          APP_ENV: test
        run: php bin/phpunit --testsuite Integration

      - name: Functional tests
        working-directory: game-service
        env:
          APP_ENV: test
        run: php bin/phpunit --testsuite Functional
