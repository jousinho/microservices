services:

  # ── Base de datos ──────────────────────────────────────────────────────────

  mysql-game:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_game_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_TEST_PORT}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  # ── game-service (PHP / Symfony) ───────────────────────────────────────────

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${GAME_SERVICE_PORT}:80"
    volumes:
      - ./game-service/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./game-service/public:/var/www/html/public:ro
    depends_on:
      - php-fpm
    networks:
      - game_network

  php-fpm:
    build:
      context: ./game-service
      dockerfile: Dockerfile
      target: fpm
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-game:3306/${MYSQL_DATABASE}?serverVersion=8.0&charset=utf8mb4"
      AUDIO_BRAIN_URL: ${AUDIO_BRAIN_URL}
    volumes:
      - ./game-service:/var/www/html
      - game_vendor:/var/www/html/vendor
    depends_on:
      mysql-game:
        condition: service_healthy
    networks:
      - game_network

  php-cli:
    build:
      context: ./game-service
      dockerfile: Dockerfile
      target: cli
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-game:3306/${MYSQL_DATABASE}?serverVersion=8.0&charset=utf8mb4"
      AUDIO_BRAIN_URL: ${AUDIO_BRAIN_URL}
    volumes:
      - ./game-service:/var/www/html
      - game_vendor:/var/www/html/vendor
    depends_on:
      mysql-game:
        condition: service_healthy
    networks:
      - game_network
    command: tail -f /dev/null

  phpunit:
    build:
      context: ./game-service
      dockerfile: Dockerfile
      target: cli
    environment:
      APP_ENV: test
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-test:3306/${MYSQL_TEST_DATABASE}?serverVersion=8.0&charset=utf8mb4"
    volumes:
      - ./game-service:/var/www/html
      - game_vendor:/var/www/html/vendor
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - game_network
    command: tail -f /dev/null

  # ── audio-brain (Python / FastAPI) ─────────────────────────────────────────

  audio-brain:
    build:
      context: ./audio-brain
      dockerfile: Dockerfile
    ports:
      - "${AUDIO_BRAIN_PORT}:8000"
    volumes:
      - ./audio-brain:/app
      - audio_cache:/app/audio_cache
    networks:
      - game_network

  # ── frontend (Vue.js / Vite) ───────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_GAME_SERVICE_URL: http://localhost:${GAME_SERVICE_PORT}
      VITE_AUDIO_BRAIN_URL: http://localhost:${AUDIO_BRAIN_PORT}
    depends_on:
      - php-fpm
      - audio-brain
    networks:
      - game_network

# ── Volúmenes ──────────────────────────────────────────────────────────────────

volumes:
  mysql_game_data:
  audio_cache:
  game_vendor:

# ── Redes ──────────────────────────────────────────────────────────────────────

networks:
  game_network:
    driver: bridge
